# =========================================================
# 分组（对应 urltest 出站；interval 单位为秒）
# =========================================================
proxy-groups:
  - name: CDN-AUTO
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 100
    proxies:
      - CDN-1
      - CDN-2
      - CDN-3
      - CDN-4
      - CDN-5
      - CDN-6
      - CDN-7
      - CDN-8

  # 注意：原 sing-box 配置中 LLM-AUTO 未被任何路由规则引用
  # （LLM 域名实际走 US-CORE）。此处保留分组以便手动切换使用。
  - name: LLM-AUTO
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    tolerance: 100
    proxies:
      - LLM-US
      - LLM-ETH

# =========================================================
