# =========================================================
# Clash Meta (mihomo) 配置
# 由 sing-box 1.13.x 配置等价翻译
# 结构：DNS 分流 / TUN / Hysteria2 + VLESS-WS / urltest 分组 / 规则路由
# =========================================================

mixed-port: 2080          # 对应 sing-box mixed-in (127.0.0.1:2080)
allow-lan: false          # 只监听本机
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

# ---- Clash API（对应 experimental.clash_api）----
external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
secret: ""

profile:
  store-selected: true
  store-fake-ip: true     # 对应 cache_file

# ---- NTP（对应 sing-box ntp，interval 单位为分钟）----
ntp:
  enable: true
  server: time.apple.com
  port: 123
  interval: 30

# ---- GeoData（mihomo 不支持 .srs，改用 MetaCubeX 的 dat/mmdb）----
geodata-mode: true
geo-auto-update: true
geo-update-interval: 72
geox-url:
  geosite: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat"
  geoip: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat"
  mmdb: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/country.mmdb"

# ---- TUN（对应 tun-in）----
tun:
  enable: true
  stack: gvisor
  device: tun0
  mtu: 1420
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53            # 对应 hijack-dns

# ---- 流量嗅探（对应 route.rules 里的 sniff action）----
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
    QUIC:
      ports: [443, 8443]

# ---- DNS 分流 ----
# sing-box 逻辑：geosite-cn → 阿里 DoH 直连；其余 → Cloudflare DoH 走 US-CORE
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false                      # 对应 strategy: prefer_ipv4（如需 AAAA 可改 true）
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "time.apple.com"
    - "+.ntp.org"
    - "+.pool.ntp.org"
  default-nameserver:              # 用于解析 DoH 域名本身
    - 223.5.5.5
  proxy-server-nameserver:         # 用于解析代理节点域名（hy255.todsm.com 等）
    - https://223.5.5.5/dns-query
  nameserver-policy:               # 国内域名 → 阿里 DoH 直连
    "geosite:cn": https://223.5.5.5/dns-query
  nameserver:                      # 默认（境外）→ Cloudflare DoH 经 US-CORE 出站
    - "https://cloudflare-dns.com/dns-query#US-CORE"

